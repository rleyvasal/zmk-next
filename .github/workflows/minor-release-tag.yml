name: Minor release tag

# Moves the minor tag (v0.2) to each patch release (v0.2.3) published by hand,
# so configs that pin the minor tag get it on their next build. The weekly
# upstream sync moves the tag itself: releases it creates with GITHUB_TOKEN
# don't start other workflows.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move:
    if: ${{ github.repository == 'rleyvasal/zmk-next' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move the minor tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "$TAG is not a vX.Y.Z release; nothing to move."
            exit 0
          fi
          minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          latest="$(git tag --list "${minor}.*" --sort=-v:refname | head -1)"
          if [ "$latest" != "$TAG" ]; then
            echo "$TAG is older than $latest; leaving $minor alone."
            exit 0
          fi
          git tag -f "$minor" "$TAG^{commit}"
          git push -f origin "refs/tags/$minor"
          echo "$minor -> $TAG"
