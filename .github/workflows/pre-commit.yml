name: pre-commit

on:
  pull_request:
  push:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Test the BLE profile connection checks
        run: |
          python app/tests/ble/profile_connected/test_profile_connected.py -v
          python app/tests/ble/active_connection/test_active_connection.py -v
      - name: Test the post-settings startup hook
        run: python app/tests/settings/startup/test_settings_loaded.py -v
      - name: Test the Studio UART TX path
        run: python app/tests/studio/uart_tx/test_uart_tx.py -v
      - name: Test Studio raw frames
        run: python app/tests/studio/raw_tx/test_raw_tx.py -v
      - name: Test battery reporting with the hold option off
        run: python app/tests/battery/hold_off/test_hold_off.py -v
      - name: Test battery persistence during USB startup
        run: python app/tests/battery/persistence/test_persistence.py -v
      - name: Test battery cell level after booting on USB
        run: python app/tests/battery/usb_boot/test_usb_boot.py -v
      - name: Test peripheral charge state and level hold on USB
        run: python app/tests/battery/charge_status/test_charge_status.py -v
      - name: Test charge estimate, full and settling
        run: python app/tests/battery/charge_tracking/test_charge_tracking.py -v
      - name: Test the idle split interval
        run: python app/tests/split/idle_interval/test_idle_interval.py -v
      - name: Test passkey entry
        run: python app/tests/ble/passkey_entry/test_passkey_entry.py -v
      - uses: pre-commit/action@v3.0.1
