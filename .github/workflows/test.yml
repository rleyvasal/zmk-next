name: Tests

on:
  push:
    paths:
      - ".github/workflows/test.yml"
      - "app/run-test.sh"
      - "app/tests/**"
      - "app/src/**"
      - "app/include/**"
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - "app/run-test.sh"
      - "app/tests/**"
      - "app/src/**"
      - "app/include/**"

jobs:
  collect-tests:
    outputs:
      test-dirs: ${{ steps.test-dirs.outputs.test-dirs }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Find test directories
        id: test-dirs
        run: |
          cd app/tests/
          export TESTS=$(ls -d * | grep -v ble | jq -R -s -c 'split("\n")[:-1]')
          echo "test-dirs=${TESTS}" >> $GITHUB_OUTPUT
  run-tests:
    needs: collect-tests
    strategy:
      matrix:
        test: ${{ fromJSON(needs.collect-tests.outputs.test-dirs) }}
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    env:
      # `if:` can't reference `secrets` directly, so thread it through env first
      # (same workaround zmk-next-configurator's CI already uses for this token).
      HAS_MESSAGES_TOKEN: ${{ secrets.MESSAGES_REPO_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache west modules
        uses: actions/cache@v6
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('app/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
        timeout-minutes: 2
        continue-on-error: true
      - name: Initialize workspace (west init)
        run: west init -l app
      # zmk-next-messages (modules/msgs/zmk-next-messages in app/west.yml) is
      # private; west update's own git clone has no credentials for it
      # otherwise and fails every job in this matrix, not just ones that
      # touch Runtime Config, since west update fetches every manifest
      # project unconditionally before any test-specific build starts.
      - name: Configure credentials for private zmk-next-messages module
        if: ${{ env.HAS_MESSAGES_TOKEN == 'true' }}
        run: |
          git config --global url."https://x-access-token:${{ secrets.MESSAGES_REPO_TOKEN }}@github.com/rleyvasal/zmk-next-messages".insteadOf "https://github.com/rleyvasal/zmk-next-messages"
      - name: Update modules (west update)
        run: west update --fetch-opt=--filter=tree:0
      - name: Export Zephyr CMake package (west zephyr-export)
        run: west zephyr-export
      - name: Test ${{ matrix.test }}
        working-directory: app
        run: ZMK_TESTS_VERBOSE=1 west test tests/${{ matrix.test }}
      - name: Archive artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.test }}-log-files"
          path: app/build/**/*.log
