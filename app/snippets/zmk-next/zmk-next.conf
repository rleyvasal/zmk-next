CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_RUNTIME_CONFIG=y

CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Boards that declare board_cdc_acm_uart also make it the Zephyr console, and
# console text on the Studio port would corrupt RPC frames. zmk-studio-log
# carries printk and logs over Studio instead.
CONFIG_UART_CONSOLE=n
